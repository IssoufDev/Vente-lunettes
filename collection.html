<!-- FORMULAIRE -->

<div class="modal" id="modal">

    <div class="modal-content">

        <span id="close">&times;</span>

        <h2>Commander votre lunette</h2>

        <form id="orderForm">

            <input type="text" id="product" readonly required>

            <input type="text" id="name" placeholder="Nom complet" required>

            <input type="text" id="color" placeholder="Couleur" required>

            <input type="number" id="quantity" placeholder="Quantité" required>

            <input type="tel" id="phone" placeholder="Téléphone" required>

            <input type="text" id="address" placeholder="Adresse" required>

            <textarea id="message" placeholder="Message (optionnel)"></textarea>

            <button type="submit" class="send-btn">
                Envoyer sur WhatsApp
            </button>

        </form>

    </div>

</div>
